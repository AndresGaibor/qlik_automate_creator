services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qlik_automatizaciones
      POSTGRES_USER: ${POSTGRES_USER:-qlik_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_en_produccion}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qlik_app} -d qlik_automatizaciones"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - with-postgres

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      QLIK_CLIENT_ID: ${QLIK_CLIENT_ID}
      QLIK_CLIENT_SECRET: ${QLIK_CLIENT_SECRET}
      QLIK_REDIRECT_URI: ${QLIK_REDIRECT_URI}
      QLIK_OAUTH_SCOPES: ${QLIK_OAUTH_SCOPES}
      CIFRADO_CLAVE_PRINCIPAL: ${CIFRADO_CLAVE_PRINCIPAL}
      REMOTE_API_URL: ${REMOTE_API_URL}
      REMOTE_API_KEY: ${REMOTE_API_KEY}
      BOOTSTRAP_ORGANIZACION_NOMBRE: ${BOOTSTRAP_ORGANIZACION_NOMBRE:-Empresa}
      BOOTSTRAP_TENANT_NOMBRE: ${BOOTSTRAP_TENANT_NOMBRE:-Tenant Principal}
      BOOTSTRAP_TENANT_HOST: ${BOOTSTRAP_TENANT_HOST}
      BOOTSTRAP_TENANT_ID_QLIK: ${BOOTSTRAP_TENANT_ID_QLIK}
      SUPERADMINMAIL: ${SUPERADMINMAIL}
      BOOTSTRAP_SUPERADMIN_NOMBRE: ${BOOTSTRAP_SUPERADMIN_NOMBRE:-Admin}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - with-postgres

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/vite.config.timestamp.ts:/usr/share/nginx/html/assets/vite.config.timestamp.ts:ro
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    profiles:
      - with-nginx

volumes:
  postgres_data:
